name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify native text copying
        run: npm run test:copy
      - name: Verify pasting images in the mail editor
        run: npm run test:compose-paste
      - name: Verify calendar invitation actions
        run: npm run test:calendar-actions
      - name: Verify Windows Air window chrome
        run: npm run test:window-chrome
      - name: Verify native connection recovery
        run: npm run test:connection
      - name: Verify module sandbox
        run: npm run test:modules
      - name: Verify shared module SDK
        run: npm run test:module-sdk
      - name: Verify native installer opening
        run: npm run test:updates
      - name: Verify native Windows restart updates
        if: runner.os == 'Windows'
        run: npm run test:windows-updates
