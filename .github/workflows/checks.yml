name: Checks
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify native connection recovery
        run: npm run test:connection
      - name: Verify module sandbox
        run: npm run test:modules
      - name: Verify shared module SDK
        run: npm run test:module-sdk
      - name: Verify native installer opening
        run: npm run test:updates
